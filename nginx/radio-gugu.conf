# Rádio do Gugu — nginx config
# Copie pra /etc/nginx/sites-available/radio-gugu
# E link: ln -s /etc/nginx/sites-available/radio-gugu /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name radiodogugu.automacaojs.us;

    # Limite upload (capas de e-book futuras)
    client_max_body_size 25m;

    # Proxy pro backend Node.js
    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream longo (mantém conexão aberta)
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # Health check endpoint (não proxy)
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
