<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sala do Gugu — Privada</title>
    <meta name="theme-color" content="#0a0a0f">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
    <!-- PLAYER FIXO NO TOPO -->
    <div class="topbar">
        <div class="topbar-inner">
            <button class="lp-play" id="lp-play" aria-label="Tocar rádio" type="button">
                <svg id="lp-ico-play" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                <svg id="lp-ico-pause" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true" hidden><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
                <span id="lp-spinner" class="lp-spinner" hidden></span>
            </button>
            <div class="lp-info">
                <div class="lp-line1">
                    <span class="lp-dot"></span>
                    <span class="lp-live">AO VIVO</span>
                    <span class="lp-name">Rádio do Gugu</span>
                </div>
                <div class="lp-line2">Sala privada</div>
            </div>
            <a href="/" class="lp-mute" aria-label="Voltar ao mural">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42a.9959.9959 0 0 0-1.41 0l-6.59 6.59a.9959.9959 0 0 0 0 1.41l6.59 6.59c.39.39 1.02.39 1.41 0s.39-1.02 0-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg>
            </a>
            <audio id="lp-audio" preload="auto" crossorigin="anonymous">
                <source src="https://radiodogugu.automacaojs.us/stream" type="audio/mpeg">
            </audio>
        </div>
    </div>

    <div class="sala-container">
        <header class="sala-header">
            <div class="sala-avatar">🎙️</div>
            <div class="sala-title">
                <h1>Gugu — Sala Privada</h1>
                <small>Online agora</small>
            </div>
        </header>

        <div id="chat-messages" class="chat-messages"></div>

        <div class="chat-input-row">
            <textarea id="chat-input" placeholder="Fale baixo, criatura. Tô escutando..." maxlength="800"></textarea>
            <button id="btn-send" class="btn btn-primary" style="align-self:flex-end">Enviar</button>
        </div>

        <div style="margin-top:12px;text-align:center">
            <button id="btn-broadcast" class="btn btn-ghost btn-block" disabled>
                📡 Enviar mensagem pro Ar
            </button>
        </div>
    </div>

    <nav class="tab-bar">
        <button class="tab" onclick="window.location.href='/'">
            <span class="tab-icon">🩸</span>
            <span class="tab-label">Mural</span>
        </button>
        <button class="tab" onclick="window.location.href='/?tab=musica'">
            <span class="tab-icon">🪩</span>
            <span class="tab-label">Brega</span>
        </button>
        <button class="tab" onclick="window.location.href='/?tab=conto'">
            <span class="tab-icon">📖</span>
            <span class="tab-label">Conto</span>
        </button>
        <button class="tab active">
            <span class="tab-icon">🔒</span>
            <span class="tab-label">Sala</span>
        </button>
        <button class="tab" onclick="window.location.href='/?tab=status'">
            <span class="tab-icon">📡</span>
            <span class="tab-label">Status</span>
        </button>
    </nav>

    <script src="/js/player.js"></script>
    <script src="/js/sala.js"></script>
</body>
</html>
